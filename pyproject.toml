[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-partitioned-tokenizer"
version = "1.0.0"
description = "A high-performance script-partitioned multilingual tokenizer for Indic, English, and Code LLMs"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Indic LLM Initiative"}
]
keywords = [
    "tokenizer", "indic", "nlp", "llm", "kannada", "hindi", "telugu", 
    "tamil", "malayalam", "bengali", "pretraining", "bpe", "unigram"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tokenizers>=0.20",
    "sentencepiece>=0.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
hf = ["transformers>=4.40.0", "torch>=2.0.0"]

[project.scripts]
indic-tokenizer = "tokenizer.cli:main"

[tool.setuptools]
packages = ["tokenizer"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
